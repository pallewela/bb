name: Release

# Runs after every successful CI run (ci.yml) for a push to main, on the commit CI tested:
#   version  next version = latest vX.Y.Z tag bumped by the head commit's marker
#            ([bump:major] / BREAKING CHANGE, [bump:minor], otherwise patch); the first
#            release uses the version in Cargo.toml. "[skip release]" skips the release.
#   build    one archive per target via build.yml (macOS arm64/x86_64, Linux arm64/x86_64
#            static musl, Windows x86_64), each built and checked on a native runner (PRD §8)
#   release  one GitHub release with every archive and its .sha256; then, if the repository
#            variable CRATES_IO_PUBLISH is "true", `cargo publish` of bitbucket-bb-cli
#            (trusted publishing); then the Homebrew tap (pallewela/homebrew-tap) is bumped
#            via repository_dispatch when the TAP_REPO_TOKEN secret is set.
# A manual run (workflow_dispatch) on main releases main's HEAD if CI passed on it; running
# CI manually on main does the same after testing it again.
#
# Keep this file named release.yml: crates.io trusted publishing is registered for this
# workflow filename.
#
# workflow_run runs with secrets and write access, from this file on the default branch, so
# it only acts on runs of CI that succeeded for a push (or manual run) on main of this
# repository, never on pull requests or forks, and it checks out the exact commit CI tested
# (workflow_run.head_sha), not whatever main points at now.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Queue releases so two never compute the same version. Runs that will do nothing (CI
  # failed) get their own group, so they can't displace a queued release.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    && 'release' || format('release-noop-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decide whether this run publishes a release, and with which version.
  #   publish=true  green CI for a push to main (or a manual run on main), not [skip release],
  #                 the commit not tagged yet
  version:
    name: Version
    # Only trusted triggers: a manual run, or CI that succeeded for a push or manual run on
    # main of this repository (a fork's PR from its own "main" branch must not match).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # manual runs: look up CI's result for the commit
    outputs:
      publish: ${{ steps.v.outputs.publish }}
      sha: ${{ steps.v.outputs.sha }}
      prev: ${{ steps.v.outputs.prev }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # The commit CI tested; for a manual run, the commit the run was started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Compute next version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          CARGO_VERSION="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -n1)"
          no_publish() {   # no_publish REASON
            echo "$1"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/main ] || no_publish "Not on main; not releasing."
            ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
              --jq .total_count)
            if [ "$ok" = 0 ]; then
              echo "::error::CI has not passed on ${SHA}; run CI on main (it releases when green) or wait for it."
              exit 1
            fi
          fi
          HEAD_MSG=$(git log -1 --format=%B)
          if echo "$HEAD_MSG" | grep -qiE '\[skip release\]'; then
            no_publish "Head commit requests [skip release]; not releasing."
          fi
          if [ -n "$(git tag --points-at HEAD --list 'v[0-9]*')" ]; then
            no_publish "HEAD is already tagged; not releasing again."
          fi

          PREV=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$PREV" ]; then
            NEW="v$CARGO_VERSION"
          else
            LEVEL="patch"
            if echo "$HEAD_MSG" | grep -qE '\[bump:major\]|BREAKING CHANGE'; then
              LEVEL="major"
            elif echo "$HEAD_MSG" | grep -qE '\[bump:minor\]'; then
              LEVEL="minor"
            fi
            V="${PREV#v}"; MAJ="${V%%.*}"; REST="${V#*.}"; MIN="${REST%%.*}"; PAT="${REST#*.}"
            case "$LEVEL" in
              major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN+1)); PAT=0 ;;
              patch) PAT=$((PAT+1)) ;;
            esac
            NEW="v${MAJ}.${MIN}.${PAT}"
          fi
          echo "Previous: ${PREV:-<none>}  Next: $NEW"
          {
            echo "publish=true"
            echo "prev=$PREV"
            echo "tag=$NEW"
            echo "version=${NEW#v}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}

  release:
    name: Release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write   # crates.io trusted publishing (OIDC), see "Publish to crates.io"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          pattern: bb-*
          merge-multiple: true

      - name: Collect checksums
        id: sums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
          sum() { awk '{print $1}' "dist/bb-v${VERSION}-$1.$2.sha256"; }
          {
            echo "aarch64_apple_darwin=$(sum aarch64-apple-darwin tar.gz)"
            echo "x86_64_apple_darwin=$(sum x86_64-apple-darwin tar.gz)"
            echo "x86_64_unknown_linux_musl=$(sum x86_64-unknown-linux-musl tar.gz)"
            echo "aarch64_unknown_linux_musl=$(sum aarch64-unknown-linux-musl tar.gz)"
            echo "x86_64_pc_windows_msvc=$(sum x86_64-pc-windows-msvc zip)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          PREV: ${{ needs.version.outputs.prev }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          RANGE="${PREV:+${PREV}..}HEAD"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          WIN="bb-${TAG}-x86_64-pc-windows-msvc.zip"
          {
            echo "## Changes"
            echo
            git log "$RANGE" --no-merges --format='- %s (%h)' | grep -viE '\[skip release\]' || true
            echo
            cat <<'MD'
          ## Install via Homebrew (macOS and Linux)

          ```sh
          brew install pallewela/tap/bb
          ```

          Upgrading: `brew update && brew upgrade pallewela/tap/bb`

          Use the full name `pallewela/tap/bb` in brew commands: plain `bb` also matches an unrelated cask.

          ## Manual install

          macOS or Linux: replace `TARGET` with your platform's target from the table below
          (e.g. `x86_64-unknown-linux-musl`), then

          ```sh
          MD
            echo "curl -L ${URL}/bb-${TAG}-TARGET.tar.gz | tar -xz bb"
            echo "install -m 0755 bb /usr/local/bin/bb"
            echo '```'
            echo
            echo "Windows (PowerShell): download \`${WIN}\`, then"
            echo
            echo '```powershell'
            echo "Expand-Archive ${WIN} -DestinationPath \"\$env:LOCALAPPDATA/Programs/bb\""
            echo '# then add that folder to your PATH'
            echo '```'
            echo
            echo "| Platform | Archive | SHA256 |"
            echo "|---|---|---|"
            for f in dist/*.sha256; do
              read -r sum name < "$f"
              name="${name#\*}"
              case "$name" in
                *aarch64-apple-darwin*) p="macOS Apple silicon" ;;
                *x86_64-apple-darwin*) p="macOS Intel" ;;
                *x86_64-unknown-linux-musl*) p="Linux x86_64 (static)" ;;
                *aarch64-unknown-linux-musl*) p="Linux arm64 (static)" ;;
                *x86_64-pc-windows-msvc*) p="Windows x86_64" ;;
                *) p="$name" ;;
              esac
              echo "| $p | \`$name\` | \`$sum\` |"
            done
          } > notes.md
          cat notes.md

      # Creates the tag at this commit and publishes all assets in one call
      # (releases are immutable once published).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/*

      # crates.io: on when the repository variable CRATES_IO_PUBLISH is "true". Trusted
      # publishing (no stored token) needs the crate to exist and this repo + workflow to be
      # registered under the crate's Settings → Trusted Publishing on crates.io.
      - name: Check whether to publish to crates.io
        id: crate
        env:
          ENABLED: ${{ vars.CRATES_IO_PUBLISH }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != true ]; then
            echo "CRATES_IO_PUBLISH is not \"true\"; not publishing to crates.io."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NAME="$(sed -nE 's/^name = "(.*)"/\1/p' Cargo.toml | head -n1)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} release" \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}")
          if [ "$code" = 200 ]; then
            echo "${NAME} ${VERSION} is already on crates.io; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${NAME} ${VERSION} to crates.io."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.crate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Get a crates.io token (trusted publishing)
        if: steps.crate.outputs.publish == 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6

      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Same version stamp as the binaries. --allow-dirty: the stamp is an uncommitted edit.
          sed -i -E "1,/^version = /s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo publish --allow-dirty

      - name: Check tap token presence
        id: tap
        env:
          TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          if [ -n "${TAP_REPO_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAP_REPO_TOKEN secret is not set; skipping Homebrew tap bump."
          fi

      # `sha256` is the macOS arm64 archive's (what older versions of the tap workflow read);
      # the per-target keys let it write a formula for macOS and Linux, arm64 and x86_64.
      - name: Bump Homebrew tap formula
        if: steps.tap.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        with:
          token: ${{ secrets.TAP_REPO_TOKEN }}
          repository: pallewela/homebrew-tap
          event-type: bb-release
          client-payload: |
            {
              "tag": "${{ needs.version.outputs.tag }}",
              "sha256": "${{ steps.sums.outputs.aarch64_apple_darwin }}",
              "sha256_aarch64_apple_darwin": "${{ steps.sums.outputs.aarch64_apple_darwin }}",
              "sha256_x86_64_apple_darwin": "${{ steps.sums.outputs.x86_64_apple_darwin }}",
              "sha256_x86_64_unknown_linux_musl": "${{ steps.sums.outputs.x86_64_unknown_linux_musl }}",
              "sha256_aarch64_unknown_linux_musl": "${{ steps.sums.outputs.aarch64_unknown_linux_musl }}"
            }

      # repository_dispatch only confirms the event was accepted; poll the
      # formula so a green release means brew actually has the new version.
      - name: Verify Homebrew tap formula updated
        if: steps.tap.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_SHA256: ${{ steps.sums.outputs.aarch64_apple_darwin }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            content=$(gh api repos/pallewela/homebrew-tap/contents/Formula/bb.rb \
              --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
            if printf '%s\n' "$content" | grep -qE "^  version \"${VERSION}\"\$" \
               && printf '%s\n' "$content" | grep -qiE "^ +sha256 \"${EXPECTED_SHA256}\"\$"; then
              echo "Tap formula updated to ${VERSION}."
              exit 0
            fi
            echo "Formula not yet at ${VERSION} (attempt ${attempt}/18); sleeping 10s..."
            sleep 10
          done
          echo "::error::Tap formula did not update to ${VERSION} within 3 minutes."
          exit 1
