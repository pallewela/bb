name: Scorecard

# OpenSSF Scorecard: supply-chain security checks, published to the Scorecard API
# (badge at https://scorecard.dev/viewer/?uri=github.com/pallewela/bb) and uploaded
# as SARIF to code scanning (Security tab).
#
# publish_results: true imposes restrictions on this workflow (verified by the Scorecard
# API, or publishing fails): no top-level env or defaults, no write permissions at the
# top level, the job runs on a GitHub-hosted Ubuntu runner without containers or services,
# and its steps only use the approved actions (checkout, scorecard-action, upload-artifact,
# codeql-action/upload-sarif). Keep it that way.

on:
  push:
    branches: [main]
  # Re-score Branch-Protection when the rules change.
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'   # weekly, Monday 04:27 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish_results: OIDC token for the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: results.sarif
