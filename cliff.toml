# git-cliff configuration (https://git-cliff.org/docs/configuration).
#
# Regenerate CHANGELOG.md from the full history:   git cliff -o CHANGELOG.md
# Preview what the next release would contain:     git cliff --unreleased
# .github/workflows/release.yml uses the same config for the GitHub release notes
# (`git cliff --unreleased --tag vX.Y.Z --strip all`), and after each release its
# changelog job opens a PR that regenerates CHANGELOG.md up to the new tag.

[changelog]
header = """
# Changelog

All notable changes to bb are listed here, newest first. Generated by
[git-cliff](https://git-cliff.org) from the commit history (see `cliff.toml`);
releases are tagged `vX.Y.Z` and published on
[GitHub](https://github.com/pallewela/bb/releases). After each release, CI opens a PR
that updates this file; to regenerate it by hand, run `git cliff -o CHANGELOG.md`.
"""
body = """
{%- set repo = "https://github.com/pallewela/bb" -%}
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = false
postprocessors = [
  # Link "(#12)" PR references.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/pallewela/bb/pull/${1}))" },
]

[git]
conventional_commits = true
# Keep non-conventional commits (e.g. "Initial commit"); they land in "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Release markers drive the version bump in release.yml; they are not part of the change.
  { pattern = '\s*\[bump:(major|minor|patch)\]', replace = "" },
  # Co-authored-by trailers (any case) are not changelog material.
  { pattern = '(?im)^co-authored-by:.*$', replace = "" },
]
commit_parsers = [
  # Merge commits: the merged commits themselves are listed.
  { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
  # "[skip release]" in the subject marks changes that do not ship in the binary (docs,
  # tests, CI); the release notes never listed them, and neither does the changelog.
  # Subject only: a squash-merge body may mention the marker without meaning it.
  { message = "^[^\\n]*(?i)\\[skip release\\]", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
  { message = "^chore\\(deps", group = "<!-- 7 -->Dependencies" },
  { message = "^(chore|style)", group = "<!-- 8 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 9 -->Reverts" },
  { message = ".*", group = "<!-- 99 -->Other" },
]
