# Each OS in ci.yml uploads its own report (flags macos, linux, windows). Wait for all three
# before posting statuses or the PR comment, so they reflect the merged coverage.
codecov:
  notify:
    after_n_builds: 3
comment:
  after_n_builds: 3
coverage:
  status:
    # Whole-project coverage may not drop more than 1 point below the base branch.
    project:
      default:
        target: auto
        threshold: 1%
    # Lines a PR adds or changes must be at least 80% covered.
    patch:
      default:
        target: 80%
