[package]
# Published on crates.io as `bitbucket-bb-cli` (`bb` is taken); the command is still `bb`.
name = "bitbucket-bb-cli"
# Releases stamp the version from the git tag (see .github/workflows/release.yml); this one is
# only for local builds.
version = "0.1.0"
edition = "2024"
description = "bb: a gh-style CLI for Bitbucket Cloud (pull requests, Pipelines, repos, API)"
license = "MIT"
repository = "https://github.com/pallewela/bb"
homepage = "https://github.com/pallewela/bb"
readme = "README.md"
keywords = ["bitbucket", "cli", "gh", "pull-request", "pipelines"]
categories = ["command-line-utilities", "development-tools"]
# What goes into the crate: just what's needed to build (SKILL.md is built into `bb skill install`). Tests, scripts and docs stay in git.
include = ["/src/**/*.rs", "/skills/bitbucket-cli/SKILL.md", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
keyring = "4.2.0"
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
