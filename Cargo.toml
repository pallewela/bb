[package]
name = "bb"
version = "0.1.0"
edition = "2024"
description = "A gh-style CLI for Bitbucket Cloud"
license = "MIT"
repository = "https://github.com/pallewela/bb"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
keyring = "4.2.0"
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
